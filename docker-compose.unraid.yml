# Fassung fuer den Compose Manager auf Unraid.
#
# Unterschiede zur docker-compose.yml:
#   - kein "build:" - auf dem Server liegt nur diese Datei, kein Quellverzeichnis.
#     Stattdessen das fertige Image von der GitHub-Registry.
#   - kein "env_file:" - der Compose Manager legt keine .env an, die Werte
#     stehen deshalb direkt hier.
#   - absolute Pfade; relative wuerden auf dem USB-Stick landen.
#
# Der Image-Name ist komplett klein geschrieben. Docker laesst in Image-Namen
# keine Grossbuchstaben zu, der GitHub-Benutzername hat aber welche - die
# GitHub-Action schreibt deshalb ebenfalls in Kleinbuchstaben.
services:
  trailer-de:
    image: ghcr.io/city5081/trailer-de:latest
    container_name: trailer-de
    restart: unless-stopped
    ports:
      - "8099:8081"
    environment:
      # --- Zugang zur Weboberflaeche -----------------------------------
      WEB_USERNAME: "hannes"
      WEB_PASSWORD: "bitte-aendern"
      # Sicherer statt WEB_PASSWORD (erzeugen mit tools/hash_password.py):
      # WEB_PASSWORD_HASH: "scrypt:32768:8:1$..."
      SECRET_KEY: "bitte-lange-zufallszeichenkette-eintragen"

      # --- TMDB ---------------------------------------------------------
      TMDB_API_KEY: "dein-v3-api-key"
      LANGUAGES: "de"          # "de" = nur deutsche Trailer, "de,en" mit Rueckfall

      # --- Verhalten ----------------------------------------------------
      LINK_FORMAT: "emby"      # emby | kodi | url
      SCAN_INTERVAL_HOURS: "12"
      SCAN_ON_START: "true"
      RECHECK_DAYS: "30"
      UI_LANGUAGE: "de"        # de | en

      # --- Webhook (Emby / Jellyfin / Jellyseerr) ------------------------
      # Nichts eintragen noetig: beim ersten Start wird ein Token erzeugt und
      # unter /config/webhook_token abgelegt. Die fertige Adresse steht in der
      # Oberflaeche unter Einstellungen -> Webhook.
      # WEBHOOK_TOKEN: "nur-fuer-ein-bestimmtes-token"

      TZ: "Europe/Vienna"
      # Gleiche Kennungen wie die Filmfreigabe (nobody/users)
      PUID: "99"
      PGID: "100"
    volumes:
      - /mnt/user/appdata/trailer-de:/config
      # Muss beschreibbar sein, sonst koennen die NFOs nicht geaendert werden.
      - /mnt/user/Filme:/movies
