[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4"]
# E741: in language lists the loop variable really is called l.
# UP is deliberately absent: the application uses .format() throughout and
# should not end up half converted to f-strings.
ignore = ["E741"]
