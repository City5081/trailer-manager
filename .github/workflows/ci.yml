name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Without workflow_call, docker.yml cannot call this file through "uses:" -
  # the build workflow would fail to load at all.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
