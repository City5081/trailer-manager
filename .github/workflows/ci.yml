name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Ohne workflow_call darf docker.yml diese Datei nicht per "uses:" aufrufen -
  # der Build-Workflow laesst sich sonst gar nicht erst laden.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q
