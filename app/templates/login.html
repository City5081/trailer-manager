{% extends "base.html" %}
{% block content %}
<div class="card narrow">
  <h1>{{ t('login.title') }}</h1>
  {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label>{{ t('login.user') }}<input name="username" autofocus autocomplete="username"></label>
    <label>{{ t('login.password') }}<input name="password" type="password" autocomplete="current-password"></label>
    <button class="primary" type="submit">{{ t('login.submit') }}</button>
  </form>
  <p class="hint">{{ t('login.hint') }}</p>
</div>
{% endblock %}
