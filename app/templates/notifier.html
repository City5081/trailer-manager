{% extends "base.html" %}
{% block content %}
<form method="post" class="card setup">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="cardhead">
    <h1>{{ target['service'] }}</h1>
    <a class="close" title="{{ t('action.back') }}" href="{{ url_for('settings_page') }}">&times;</a>
  </div>

  <label>{{ t('notify.service') }}
    <select name="service">
      {% for name in services %}
        <option value="{{ name }}" {% if target['service'] == name %}selected{% endif %}>{{ name }}</option>
      {% endfor %}
    </select>
  </label>
  <label>{{ t('notify.url') }}
    <input class="mono" name="url" value="{{ target['url'] }}" required>
  </label>
  <p class="hint">{{ t('notify.url_hint') }}</p>
  <ul class="steps">
    {% for name in services %}<li><b>{{ name }}</b>: <span class="mono small">{{ examples[name] }}</span></li>{% endfor %}
  </ul>
  <label>{{ t('notify.token') }}
    <input class="mono" name="token" value="{{ target['token'] or '' }}" autocomplete="off">
  </label>
  <p class="hint">{{ t('notify.token_hint') }}</p>
  <label class="inline"><input type="checkbox" name="enabled" {% if target['enabled'] %}checked{% endif %}> {{ t('library.enabled') }}</label>

  <div class="toolbar">
    <button class="primary" type="submit">{{ t('action.save') }}</button>
    <button formaction="{{ url_for('notifier_test', notifier_id=target['id']) }}" formmethod="post">{{ t('notify.test') }}</button>
    <a class="btn" href="{{ url_for('settings_page') }}">{{ t('action.back') }}</a>
  </div>
</form>
{% endblock %}
